name: Contribution snake

# Draws the contribution graph as a snake (Platane/snk), dark + light, and commits
# the SVGs to the branch it ran on. Uses only the built-in GITHUB_TOKEN.
on:
  schedule:
    - cron: "47 2 * * *" # daily, 02:47 UTC
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/snake.yml"

permissions:
  contents: write

concurrency:
  group: profile-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            profile/snake-light.svg?palette=github-light
            profile/snake-dark.svg?palette=github-dark
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit snake
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/snake-*.svg
          git diff --cached --quiet && exit 0
          git commit -m "chore: update contribution snake"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
